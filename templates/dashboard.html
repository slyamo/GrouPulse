<!DOCTYPE html>
<html>
<head>
  <title>Group Pulse - Dashboard</title>
  <link rel="stylesheet" href="../static/dashboard.css">
</head>
<body>

  <div class="topbar">
    <span><b>Group Pulse</b></span>
    <span id="welcomeMsg"></span>
    <div>
      <button onclick="goLobby()">Back to Lobby</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- nav links -->
  <div class="navbar">
    <a href="/dashboard">Dashboard</a>
    <a href="/tasks" id="tasksLink">Tasks</a>
    <a href="/progress">Progress</a>
    <a href="/evaluation">Peer Evaluation</a>
  </div>

  <div class="content">

    <!-- group header -->
    <div class="group-header">
      <div>
        <h2 id="groupName">Loading...</h2>
        <p id="groupSubject"></p>
        <p id="groupDesc"></p>
      </div>
      <div class="group-info-right">
        <p>📅 Due: <b id="groupDue"></b></p>
        <p>👤 Leader: <b id="groupLeader"></b></p>
        <p id="inviteSection"></p>
      </div>
    </div>

    <!-- summary cards -->
    <div class="cards">
      <div class="card blue">
        <h3 id="totalTasks">0</h3>
        <p>Total Tasks</p>
      </div>
      <div class="card green">
        <h3 id="doneTasks">0</h3>
        <p>Completed</p>
      </div>
      <div class="card orange">
        <h3 id="pendingTasks">0</h3>
        <p>Pending</p>
      </div>
      <div class="card purple">
        <h3 id="totalMembers">0</h3>
        <p>Members</p>
      </div>
    </div>

    <!-- members list -->
    <div class="section">
      <h3>Group Members</h3>
      <div id="membersList"><p>No members yet.</p></div>
    </div>

    <!-- recent tasks -->
    <div class="section">
      <h3>Recent Tasks</h3>
      <table>
        <thead>
          <tr>
            <th>Task</th>
            <th>Assigned To</th>
            <th>Due Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recentTasks">
          <tr><td colspan="4">No tasks yet.</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    var loggedIn = null;
    var activeGroupId = sessionStorage.getItem("gp_activeGroup");

    if (!activeGroupId) {
      window.location.href = "/lobby";
    }

    // get logged in user
    fetch("/api/me")
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (!data.success) {
        window.location.href = "/login";
        return;
      }

      loggedIn = data.user;
      document.getElementById("welcomeMsg").innerHTML = loggedIn.name + " (" + loggedIn.role + ")";

      if (loggedIn.role == "instructor") {
        document.getElementById("tasksLink").title = "View only";
      }

      loadGroup();
    });

    function logout() {
      fetch("/api/logout", { method: "POST" })
      .then(function() {
        window.location.href = "/login";
      });
    }

    function goLobby() {
      sessionStorage.removeItem("gp_activeGroup");
      window.location.href = "/lobby";
    }

    function loadGroup() {
      fetch("/api/groups/" + activeGroupId)
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (!data.success) {
          alert("Group not found!");
          window.location.href = "/lobby";
          return;
        }

        var group = data.group;

        document.getElementById("groupName").innerHTML = group.name;
        document.getElementById("groupSubject").innerHTML = "📚 " + group.subject;
        document.getElementById("groupDesc").innerHTML = group.description || "";
        document.getElementById("groupDue").innerHTML = group.dueDate;
        document.getElementById("groupLeader").innerHTML = group.leaderName;
        document.getElementById("totalMembers").innerHTML = group.members.length;

        // show invite code for students
        if (loggedIn.role != "instructor") {
          document.getElementById("inviteSection").innerHTML =
            "🔗 Invite Code: <b>" + group.code + "</b> " +
            "<button onclick='copyCode(\"" + group.code + "\")' style='font-size:11px; padding:3px 8px; cursor:pointer;'>Copy Code</button>";
        }

        // members tags
        if (group.members.length > 0) {
          var mHTML = "";
          for (var i = 0; i < group.members.length; i++) {
            var isLeader = group.members[i].name == group.leaderName;
            mHTML += "<span class='member-tag'>" + group.members[i].name;
            if (isLeader) mHTML += " ⭐";
            mHTML += "</span>";
          }
          document.getElementById("membersList").innerHTML = mHTML;
        }

        loadTasks();
      });
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code).then(function() {
        alert("Invite code copied!\n\n" + code);
      });
    }

    function loadTasks() {
      fetch("/api/groups/" + activeGroupId + "/tasks")
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (!data.success) return;

        var tasks = data.tasks;
        var done = 0, pending = 0;

        for (var i = 0; i < tasks.length; i++) {
          if (tasks[i].status == "Done") done++;
          else pending++;
        }

        document.getElementById("totalTasks").innerHTML = tasks.length;
        document.getElementById("doneTasks").innerHTML = done;
        document.getElementById("pendingTasks").innerHTML = pending;

        // show last 5 tasks
        if (tasks.length > 0) {
          var start = Math.max(0, tasks.length - 5);
          var tHTML = "";
          for (var i = start; i < tasks.length; i++) {
            var c = tasks[i].status == "Done" ? "green" : "orange";
            tHTML += "<tr>";
            tHTML += "<td>" + tasks[i].name + "</td>";
            tHTML += "<td>" + tasks[i].assignedTo + "</td>";
            tHTML += "<td>" + tasks[i].dueDate + "</td>";
            tHTML += "<td style='color:" + c + ";'>" + tasks[i].status + "</td>";
            tHTML += "</tr>";
          }
          document.getElementById("recentTasks").innerHTML = tHTML;
        }
      });
    }
  </script>

</body>
</html>
