<!DOCTYPE html>
<html>
<head>
  <title>Group Pulse - Lobby</title>
  <link rel="stylesheet" href="lobby.css">
</head>
<body>

  <div class="topbar">
    <span><b>Group Pulse</b></span>
    <span id="welcomeMsg"></span>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="content">

    <h2>My Groups</h2>

    <!-- student lobby -->
    <div id="studentActions" style="display:none;">
      <button class="btn-blue" onclick="showCreateForm()">+ Create New Group</button>
      <button class="btn-outline" onclick="showJoinForm()">Join via Code</button>
    </div>

    <!-- instructor lobby -->
    <div id="instructorActions" style="display:none;">
      <div class="notice-box">
        <p>You are logged in as an <b>Instructor</b>. Enter a group code to view a group's progress and peer evaluations.</p>
      </div>
      <button class="btn-outline" onclick="showJoinForm()">Enter Group Code</button>
    </div>

    <!-- create group form (students only) -->
    <div id="createForm" class="form-box" style="display:none;">
      <h3>Create a New Group</h3>

      <label>Group Name:</label>
      <input type="text" id="gName" placeholder="e.g. Team Alpha" />

      <label>Subject / Course Name:</label>
      <input type="text" id="gSubject" placeholder="e.g. Software Engineering" />

      <label>Description:</label>
      <textarea id="gDesc" rows="3" placeholder="What is this group working on?"></textarea>

      <label>Max Number of Members:</label>
      <input type="number" id="gMax" placeholder="e.g. 5" min="2" max="20" />

      <label>Project Due Date:</label>
      <input type="date" id="gDue" />

      <br><br>
      <button class="btn-blue" onclick="createGroup()">Create Group</button>
      <button class="btn-cancel" onclick="hideCreate()">Cancel</button>
      <p id="createMsg" class="msg"></p>
    </div>

    <!-- join / enter code form -->
    <div id="joinForm" class="form-box" style="display:none;">
      <h3 id="joinFormTitle">Join a Group</h3>
      <label>Enter Group Code:</label>
      <input type="text" id="joinCode" placeholder="Paste the group code here" />
      <br><br>
      <button class="btn-blue" onclick="joinByCode()">Submit</button>
      <button class="btn-cancel" onclick="hideJoin()">Cancel</button>
      <p id="joinMsg" class="msg"></p>
    </div>

    <!-- groups list -->
    <div id="groupsList" style="margin-top: 20px;">
      <p>Loading your groups...</p>
    </div>

  </div>

  <script>
    var loggedIn = JSON.parse(localStorage.getItem("gp_loggedIn") || "null");
    if (!loggedIn) {
      window.location.href = "login.html";
    }

    document.getElementById("welcomeMsg").innerHTML = "Hello, " + loggedIn.name + " (" + loggedIn.role + ")";

    // show correct actions based on role
    if (loggedIn.role == "instructor") {
      document.getElementById("instructorActions").style.display = "block";
      document.getElementById("joinFormTitle").innerHTML = "View a Group";
    } else {
      document.getElementById("studentActions").style.display = "block";
    }

    function logout() {
      localStorage.removeItem("gp_loggedIn");
      window.location.href = "login.html";
    }

    function showCreateForm() {
      document.getElementById("createForm").style.display = "block";
      document.getElementById("joinForm").style.display = "none";
    }

    function hideCreate() {
      document.getElementById("createForm").style.display = "none";
    }

    function showJoinForm() {
      document.getElementById("joinForm").style.display = "block";
      document.getElementById("createForm").style.display = "none";
    }

    function hideJoin() {
      document.getElementById("joinForm").style.display = "none";
    }

    function createGroup() {
      var name = document.getElementById("gName").value;
      var subject = document.getElementById("gSubject").value;
      var desc = document.getElementById("gDesc").value;
      var max = document.getElementById("gMax").value;
      var due = document.getElementById("gDue").value;

      if (name == "" || subject == "" || max == "" || due == "") {
        document.getElementById("createMsg").style.color = "red";
        document.getElementById("createMsg").innerHTML = "Please fill in all required fields!";
        return;
      }

      var code = "GP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      var groups = JSON.parse(localStorage.getItem("gp_groups") || "[]");

      var newGroup = {
        id: "grp_" + Date.now(),
        code: code,
        name: name,
        subject: subject,
        description: desc,
        maxMembers: parseInt(max),
        dueDate: due,
        leader: loggedIn.id || loggedIn.name,
        leaderName: loggedIn.name,
        members: [loggedIn.id || loggedIn.name],
        memberNames: [loggedIn.name],
        instructors: [],
        createdAt: new Date().toLocaleDateString()
      };

      groups.push(newGroup);
      localStorage.setItem("gp_groups", JSON.stringify(groups));

      document.getElementById("createMsg").style.color = "green";
      document.getElementById("createMsg").innerHTML = "Group created! Code: <b>" + code + "</b>";

      document.getElementById("gName").value = "";
      document.getElementById("gSubject").value = "";
      document.getElementById("gDesc").value = "";
      document.getElementById("gMax").value = "";
      document.getElementById("gDue").value = "";

      loadGroups();
    }

    function joinByCode() {
      var code = document.getElementById("joinCode").value.trim().toUpperCase();

      if (code == "") {
        document.getElementById("joinMsg").style.color = "red";
        document.getElementById("joinMsg").innerHTML = "Please enter a group code!";
        return;
      }

      var groups = JSON.parse(localStorage.getItem("gp_groups") || "[]");
      var found = false;

      for (var i = 0; i < groups.length; i++) {
        if (groups[i].code == code) {
          found = true;

          // instructors join a separate instructors list
          if (loggedIn.role == "instructor") {
            if (!groups[i].instructors) groups[i].instructors = [];

            var alreadyViewing = false;
            for (var j = 0; j < groups[i].instructors.length; j++) {
              if (groups[i].instructors[j] == loggedIn.name) {
                alreadyViewing = true;
                break;
              }
            }

            if (alreadyViewing) {
              document.getElementById("joinMsg").style.color = "orange";
              document.getElementById("joinMsg").innerHTML = "You already have access to this group!";
              return;
            }

            groups[i].instructors.push(loggedIn.name);
            localStorage.setItem("gp_groups", JSON.stringify(groups));
            document.getElementById("joinMsg").style.color = "green";
            document.getElementById("joinMsg").innerHTML = "Access granted to: <b>" + groups[i].name + "</b>!";
            loadGroups();
            return;
          }

          // students join as members
          var alreadyIn = false;
          if (loggedIn.id && groups[i].members.indexOf(loggedIn.id) != -1) alreadyIn = true;
          if (groups[i].memberNames.indexOf(loggedIn.name) != -1) alreadyIn = true;

          if (alreadyIn) {
            document.getElementById("joinMsg").style.color = "orange";
            document.getElementById("joinMsg").innerHTML = "You are already in this group!";
            return;
          }

          if (groups[i].members.length >= groups[i].maxMembers) {
            document.getElementById("joinMsg").style.color = "red";
            document.getElementById("joinMsg").innerHTML = "This group is full!";
            return;
          }

          groups[i].members.push(loggedIn.id || loggedIn.name);
          groups[i].memberNames.push(loggedIn.name);
          localStorage.setItem("gp_groups", JSON.stringify(groups));

          document.getElementById("joinMsg").style.color = "green";
          document.getElementById("joinMsg").innerHTML = "Joined group: <b>" + groups[i].name + "</b>!";
          loadGroups();
          break;
        }
      }

      if (!found) {
        document.getElementById("joinMsg").style.color = "red";
        document.getElementById("joinMsg").innerHTML = "Group code not found. Please check and try again.";
      }
    }

    function openGroup(groupId) {
      localStorage.setItem("gp_activeGroup", groupId);
      window.location.href = "dashboard.html";
    }

    function loadGroups() {
      var groups = JSON.parse(localStorage.getItem("gp_groups") || "[]");
      var container = document.getElementById("groupsList");
      var myGroups = [];

      for (var i = 0; i < groups.length; i++) {
        if (loggedIn.role == "instructor") {
          // only show groups this instructor has joined
          if (groups[i].instructors && groups[i].instructors.indexOf(loggedIn.name) != -1) {
            myGroups.push(groups[i]);
          }
        } else {
          var isMember = false;
          if (loggedIn.id && groups[i].members.indexOf(loggedIn.id) != -1) isMember = true;
          if (!isMember && groups[i].memberNames.indexOf(loggedIn.name) != -1) isMember = true;
          if (isMember) myGroups.push(groups[i]);
        }
      }

      if (myGroups.length == 0) {
        if (loggedIn.role == "instructor") {
          container.innerHTML = "<p>You have not joined any groups yet. Use a group code to get access.</p>";
        } else {
          container.innerHTML = "<p>You are not in any groups yet. Create one or join using a code!</p>";
        }
        return;
      }

      var html = "<div class='groups-grid'>";

      for (var i = 0; i < myGroups.length; i++) {
        var g = myGroups[i];
        var isLeader = g.leader == loggedIn.id || g.leaderName == loggedIn.name;
        var memberCount = g.members.length;

        var badgeHTML = "";
        if (loggedIn.role == "instructor") {
          badgeHTML = "<span class='badge-instructor'>Instructor</span>";
        } else if (isLeader) {
          badgeHTML = "<span class='badge-leader'>Leader</span>";
        } else {
          badgeHTML = "<span class='badge-member'>Member</span>";
        }

        html += "<div class='group-card'>";
        html += "<div class='group-card-top'><h3>" + g.name + "</h3>" + badgeHTML + "</div>";
        html += "<p class='subject'>" + g.subject + "</p>";
        html += "<p class='desc'>" + (g.description || "No description.") + "</p>";
        html += "<div class='group-meta'>";
        html += "<span>👥 " + memberCount + " / " + g.maxMembers + " members</span>";
        html += "<span>📅 Due: " + g.dueDate + "</span>";
        html += "</div>";
        html += "<p class='group-code'>Code: <b>" + g.code + "</b></p>";
        html += "<p class='leader-name'>Leader: " + g.leaderName + "</p>";
        html += "<button class='btn-blue' onclick='openGroup(\"" + g.id + "\")'>Open Group</button>";
        html += "</div>";
      }

      html += "</div>";
      container.innerHTML = html;
    }

    // check if arrived via invite link
    var urlParams = new URLSearchParams(window.location.search);
    var inviteCode = urlParams.get("join");
    if (inviteCode) {
      document.getElementById("joinCode").value = inviteCode;
      showJoinForm();
      joinByCode();
    }

    loadGroups();
  </script>

</body>
</html>
